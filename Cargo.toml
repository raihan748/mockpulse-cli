[package]
name = "mockpulse-cli"
version = "0.1.0"
edition = "2021"
authors = ["SMK Telkom Developer <dev@smktelkom-mks.sch.id>"]
description = "Instant zero-config HTTP mock server from OpenAPI/JSON Schema with latency simulation and chaos fault injection"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/smktelkom-mks/mockpulse-cli"
keywords = ["mock", "openapi", "http", "chaos-engineering", "testing"]
categories = ["development-tools", "web-programming::http-server"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
tiny_http = "0.12"
rand = "0.8"
colored = "2.1"

[dev-dependencies]
tempfile = "3.10"
